name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: schoolbot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d schoolbot_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile application and migration files
        run: |
          python -m py_compile app.py migrate.py migrations/env.py migrations/versions/*.py
      - name: Run smoke tests
        env:
          BOT_TOKEN: "123456:TEST_TOKEN"
          DATABASE_URL: "postgresql+asyncpg://postgres:postgres@localhost:5432/schoolbot_test"
          TIMEZONE: "Asia/Tehran"
        run: python -m unittest discover -s tests -v

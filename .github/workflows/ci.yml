name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile application and migration files
        run: |
          python -m py_compile app.py migrate.py migrations/env.py migrations/versions/20261005_01_baseline.py migrations/versions/20261005_02_schema_hardening.py
